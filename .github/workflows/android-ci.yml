name: Android CI

# Keep only the newest validation run for this branch; older commits are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned LTW source
        uses: actions/checkout@v4
        with:
          repository: MojoLauncher/LTW
          ref: 3f1f4df6c80c925ea34067b1d943a84acce0184d
          path: .third_party/LTW

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Rust for Android native build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK and cargo-ndk
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Package pinned Android GL4ES compatibility libraries
        env:
          MOJO_SOURCE_COMMIT: 1b8d90424c1cb791321d45f60ac62c54f4b013fa
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/MojoLauncher/MojoLauncher/$MOJO_SOURCE_COMMIT/app_mojo/src/main"
          mkdir -p app/src/main/assets/licenses
          declare -A blobs=(
            [arm64-v8a]=964c4a7714bad3011dd59e6f832c958a7513211a
            [armeabi-v7a]=caf2962636decc6af10ec8d0e797ac2484cdd0d7
            [x86]=b21cc6eecc1cef296c65b50724a5bb4315c61e8b
            [x86_64]=3c23abbd4f9e0304ab084f88d08f53b9624ecda0
          )
          for abi in "${!blobs[@]}"; do
            mkdir -p "app/src/main/jniLibs/$abi"
            file="app/src/main/jniLibs/$abi/libgl4es_114.so"
            curl -fsSL "$base/jniLibs/$abi/libgl4es_114.so" -o "$file"
            actual="$(git hash-object "$file")"
            test "$actual" = "${blobs[$abi]}" || { echo "GL4ES source blob mismatch for $abi"; exit 1; }
            echo "$abi: verified pinned GL4ES blob $actual"
          done
          license="app/src/main/assets/licenses/LICENSE-gl4es.txt"
          curl -fsSL "$base/assets/licenses/LICENSE-gl4es" -o "$license"
          test "$(git hash-object "$license")" = "57dbca92b4cbc989e95d3a6fcb63ea2e70825381"
          echo "Verified GL4ES MIT license text."

      - name: Install Android GLFW and MojoExec license texts
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          cp native/upstream/mojo-glfw/LICENSE.md app/src/main/assets/licenses/LICENSE-Mojo-GLFW.txt
          cp native/upstream/mojoexec/LICENSE app/src/main/assets/licenses/LICENSE-MojoExec.txt
          test -s app/src/main/assets/licenses/LICENSE-Mojo-GLFW.txt
          test -s app/src/main/assets/licenses/LICENSE-MojoExec.txt

      - name: Build O Engine Rust native library for all Android ABIs
        working-directory: native/oengine
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../../app/src/main/jniLibs build --release

      - name: Build pinned Android GLFW backend for all Android ABIs
        run: |
          set -euo pipefail
          python3 native/patches/patch_mojo_glfw_input.py
          python3 native/patches/patch_mojo_glfw_egl.py
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            build_dir="$RUNNER_TEMP/oengine-glfw-$abi"
            cmake -S native/android-glfw -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=26 \
              -DGLFW_BUILD_ANDROID=ON -DBUILD_SHARED_LIBS=ON \
              -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF \
              -DGLFW_BUILD_DOCS=OFF -DGLFW_INSTALL=OFF
            cmake --build "$build_dir" --parallel 2
            destination="app/src/main/jniLibs/$abi"
            mkdir -p "$destination"
            for library in libglfw.so libmojoexec.so liblinkerhook.so; do
              source="$(find "$build_dir" -type f -name "$library" -print -quit)"
              test -n "$source" && test -s "$source"
              cp "$source" "$destination/$library"
            done
            if [ "$abi" = "arm64-v8a" ]; then
              source="$(find "$build_dir" -type f -name libfopenhook.so -print -quit)"
              test -n "$source" && test -s "$source"
              cp "$source" "$destination/libfopenhook.so"
            fi
            echo "Built Android GLFW + MojoExec for $abi"
          done

      - name: Build and package pinned LTW release AAR
        working-directory: .third_party/LTW
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :ltw:assembleRelease
          test -s ltw/build/outputs/aar/ltw-release.aar
          mkdir -p ../../app/libs
          cp ltw/build/outputs/aar/ltw-release.aar ../../app/libs/ltw-release.aar
          sha256sum ../../app/libs/ltw-release.aar

      - name: Install LTW license texts and third-party notice
        working-directory: .third_party/LTW
        run: |
          set -euo pipefail
          mkdir -p ../../app/src/main/assets/licenses
          cp LICENSE ../../app/src/main/assets/licenses/LGPL-3.0-LTW.txt
          if [ -s /usr/share/common-licenses/GPL-3 ]; then
            cp /usr/share/common-licenses/GPL-3 ../../app/src/main/assets/licenses/GPL-3.0.txt
          else
            curl --fail --show-error --location --retry 4 --retry-all-errors --connect-timeout 20 \
              https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0.txt \
              -o ../../app/src/main/assets/licenses/GPL-3.0.txt
          fi
          test -s ../../app/src/main/assets/licenses/GPL-3.0.txt
          cp ../../THIRD_PARTY_NOTICES.md ../../app/src/main/assets/THIRD_PARTY_NOTICES.md

      - name: Install original uploaded artwork (preserve filenames)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp artwork/3dd9fe30-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/hero_nether.png
          cp artwork/7a2ad1c0-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/minecraft_java_logo.png
          cp artwork/a9ac7da0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_trials.png
          cp artwork/a9af8ae0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_spring.png
          cp artwork/b390fdf0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_camel.png
          cp artwork/a9ac2f80-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/hero_banner_reference.png
          echo "Installed the six original user uploads with explicit asset mapping."

      - name: Validate LTW EGL C ABI header layout
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/oengine_ltw_egl_abi.c" <<'EOF'
          #include <stddef.h>
          #include "oengine_ltw_egl.h"
          _Static_assert(offsetof(OEngineLtwEglShareInfo, display) == 0, "display offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, config) == sizeof(void*), "config offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, context) == 2 * sizeof(void*), "context offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, pbuffer) == 3 * sizeof(void*), "pbuffer offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, window_surface) == 4 * sizeof(void*), "window surface offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, create_context) == 5 * sizeof(void*), "create context offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, make_current) == 6 * sizeof(void*), "make current offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, destroy_context) == 7 * sizeof(void*), "destroy context offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, destroy_surface) == 8 * sizeof(void*), "destroy surface offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, swap_buffers) == 9 * sizeof(void*), "swap buffers offset");
          _Static_assert(sizeof(OEngineLtwEglShareInfo) == 10 * sizeof(void*), "share info size");
          int main(void) { return 0; }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I native/oengine/include "$RUNNER_TEMP/oengine_ltw_egl_abi.c"

      - name: Run engine JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify Rust native engine and JNI exports in APK
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          NM="$(command -v nm)"
          test -x "$NM"
          export NM
          python3 - <<'PY'
          import os, zipfile, subprocess, tempfile
          apk = os.environ["APK_PATH"]
          expected_abis = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
          symbols = {"Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeProbeJvmLibrary", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeInstallLwjglHook", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeCreateJvm", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeInvokeMain", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeLoadRenderer", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeRendererLoadError", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeAcquireWindow", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeReleaseWindow", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeCreateLtwEglSession", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeAttachLtwWindow", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeDetachLtwWindow", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeSwapLtwBuffers", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeLtwEglInfo", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeLtwEglError", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeDestroyLtwEglSession", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeEnqueueInputBatch", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeInputResetPending", "oengine_input_drain", "oengine_input_dispatch", "oengine_input_reset_pending", "oengine_input_clear_session", "oengine_ltw_egl_share_info"}
          with zipfile.ZipFile(apk) as archive:
              entries = {
                  name.split("/")[1]: name
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith("/liboengine_native.so")
              }
              missing = expected_abis - set(entries)
              if missing:
                  raise SystemExit(f"Rust native engine missing ABIs: {sorted(missing)}")
              ltw_entries = {
                  name.split("/")[1]: name
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith("/libltw.so")
              }
              missing_ltw = expected_abis - set(ltw_entries)
              if missing_ltw:
                  raise SystemExit(f"Pinned LTW renderer missing ABIs from APK: {sorted(missing_ltw)}")
              for abi in sorted(expected_abis):
                  for library in ("libglfw.so", "libmojoexec.so", "liblinkerhook.so"):
                      path = f"lib/{abi}/{library}"
                      if path not in archive.namelist() or archive.getinfo(path).file_size < 64:
                          raise SystemExit(f"{abi}: packaged Android GLFW dependency missing or empty: {library}")
                  print(f"{abi}: verified Android GLFW, MojoExec and linker-hook libraries")
              if "lib/arm64-v8a/libfopenhook.so" not in archive.namelist():
                  raise SystemExit("arm64-v8a: MojoExec fopenhook dependency is missing")
              glfw_symbols = {
                  "glfwInit",
                  "glfwPollEvents",
                  "glfwCreateWindow",
                  "Java_git_artdeell_dnbootstrap_glfw_GLFW_initialize",
                  "Java_git_artdeell_dnbootstrap_glfw_GLFW_nativeSurfaceCreated",
                  "Java_git_artdeell_dnbootstrap_glfw_GLFW_nativeSurfaceDestroyed",
                  "Java_git_artdeell_dnbootstrap_glfw_GLFW_sendRawKeyEvent",
                  "oengine_wake_input",
              }
              lwjgl_required_symbols = {
                  line.strip()
                  for line in open("native/android-glfw/lwjgl-3.3.3-required-symbols.txt", encoding="utf-8")
                  if line.strip() and not line.lstrip().startswith("#")
              }
              if len(lwjgl_required_symbols) < 100:
                  raise SystemExit("Pinned LWJGL GLFW export manifest is unexpectedly incomplete")
              glfw_symbols |= lwjgl_required_symbols
              for abi in sorted(expected_abis):
                  path = f"lib/{abi}/libglfw.so"
                  with tempfile.NamedTemporaryFile(suffix=".so") as native:
                      native.write(archive.read(path))
                      native.flush()
                      output = subprocess.check_output(
                          [os.environ["NM"], "--dynamic", "--defined-only", native.name],
                          text=True
                      )
                      exported = {line.split()[-1].split("@")[0] for line in output.splitlines() if line.split()}
                      absent = glfw_symbols - exported
                      if absent:
                          raise SystemExit(f"{abi}: Android GLFW exports missing: {sorted(absent)}")
                      print(f"{abi}: verified Android GLFW entry points: {sorted(glfw_symbols)}")
              for abi, name in sorted(ltw_entries.items()):
                  if archive.getinfo(name).file_size < 64:
                      raise SystemExit(f"{abi}: packaged LTW native library is unexpectedly small")
                  print(f"{abi}: verified packaged LTW renderer: {name}")
              for abi in sorted(expected_abis):
                  gl4es = f"lib/{abi}/libgl4es_114.so"
                  if gl4es not in archive.namelist():
                      raise SystemExit(f"{abi}: packaged Android GL4ES library is missing")
                  if archive.getinfo(gl4es).file_size < 100000:
                      raise SystemExit(f"{abi}: packaged GL4ES library is unexpectedly small")
                  print(f"{abi}: verified packaged Android GL4ES compatibility library")
              for abi in sorted(expected_abis):
                  with tempfile.NamedTemporaryFile(suffix=".so") as native:
                      native.write(archive.read(entries[abi]))
                      native.flush()
                      output = subprocess.check_output(
                          [os.environ["NM"], "--dynamic", "--defined-only", native.name],
                          text=True
                      )
                      exported = {line.split()[-1].split("@")[0] for line in output.splitlines() if line.split()}
                      absent = symbols - exported
                      if absent:
                          raise SystemExit(f"{abi}: JNI exports are missing: {sorted(absent)}")
                      print(f"{abi}: verified Rust engine and JNI exports: {sorted(symbols)}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: o-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
