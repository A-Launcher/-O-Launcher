name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Rust for Android native build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK and cargo-ndk
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Build O Engine Rust native library for all Android ABIs
        working-directory: native/oengine
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../../app/src/main/jniLibs build --release

      - name: Install original uploaded artwork (preserve filenames)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp artwork/3dd9fe30-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/hero_nether.png
          cp artwork/7a2ad1c0-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/minecraft_java_logo.png
          cp artwork/a9ac7da0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_trials.png
          cp artwork/a9af8ae0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_spring.png
          cp artwork/b390fdf0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_camel.png
          cp artwork/a9ac2f80-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/hero_banner_reference.png
          echo "Installed the six original user uploads with explicit asset mapping."

      - name: Run engine JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify Rust native engine and JNI exports in APK
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          NM="$(command -v nm)"
          test -x "$NM"
          export NM
          python3 - <<'PY'
          import os, zipfile, subprocess, tempfile
          apk = os.environ["APK_PATH"]
          expected_abis = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
          symbols = {"Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeProbeJvmLibrary", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeInstallLwjglHook", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeCreateJvm", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeInvokeMain", "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeLoadRenderer
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeRendererLoadError"}
          with zipfile.ZipFile(apk) as archive:
              entries = {
                  name.split("/")[1]: name
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith("/liboengine_native.so")
              }
              missing = expected_abis - set(entries)
              if missing:
                  raise SystemExit(f"Rust native engine missing ABIs: {sorted(missing)}")
              for abi in sorted(expected_abis):
                  with tempfile.NamedTemporaryFile(suffix=".so") as native:
                      native.write(archive.read(entries[abi]))
                      native.flush()
                      output = subprocess.check_output(
                          [os.environ["NM"], "--dynamic", "--defined-only", native.name],
                          text=True
                      )
                      exported = {line.split()[-1].split("@")[0] for line in output.splitlines() if line.split()}
                      absent = symbols - exported
                      if absent:
                          raise SystemExit(f"{abi}: JNI exports are missing: {sorted(absent)}")
                      print(f"{abi}: verified Rust engine and JNI exports: {sorted(symbols)}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: o-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
