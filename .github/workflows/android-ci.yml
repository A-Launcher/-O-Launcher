name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install original uploaded artwork (preserve filenames)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp artwork/3dd9fe30-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/hero_nether.png
          cp artwork/7a2ad1c0-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/minecraft_java_logo.png
          cp artwork/a9ac7da0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_trials.png
          cp artwork/a9af8ae0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_spring.png
          cp artwork/b390fdf0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_camel.png
          cp artwork/a9ac2f80-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/hero_banner_reference.png
          echo "Installed the six original user uploads with explicit asset mapping."

      - name: Run engine JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify native JVM probe ABI artifacts
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          LLVM_NM="$(find "$ANDROID_HOME/ndk" -type f -name llvm-nm | sort | tail -n 1)"
          test -x "$LLVM_NM"
          python3 - <<'PY'
          import os, zipfile, subprocess, tempfile
          apk = os.environ["APK_PATH"]
          expected_abis = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
          symbol = "Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeProbeJvmLibrary"
          with zipfile.ZipFile(apk) as archive:
              entries = {
                  name.split("/")[1]: name
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith("/liboengine_bootstrap.so")
              }
              missing = expected_abis - set(entries)
              if missing:
                  raise SystemExit(f"Native JVM probe missing ABIs: {sorted(missing)}")
              for abi in sorted(expected_abis):
                  with tempfile.NamedTemporaryFile(suffix=".so") as native:
                      native.write(archive.read(entries[abi]))
                      native.flush()
                      output = subprocess.check_output(
                          [os.environ["LLVM_NM"], "--dynamic", "--defined-only", native.name],
                          text=True
                      )
                      exported = {line.split()[-1].split("@")[0] for line in output.splitlines() if line.split()}
                      if symbol not in exported:
                          raise SystemExit(f"{abi}: JNI probe export is missing")
                      print(f"{abi}: verified {symbol}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: o-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
