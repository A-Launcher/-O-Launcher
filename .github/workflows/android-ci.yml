name: Android CI

# Keep only the newest validation run for this branch; older commits are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned LTW source
        uses: actions/checkout@v4
        with:
          repository: MojoLauncher/LTW
          ref: 3f1f4df6c80c925ea34067b1d943a84acce0184d
          path: .third_party/LTW

      - name: Align pinned Mojo subproject Android plugin requests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path("third_party/MojoLauncher/glfw/jni_bindings/build.gradle"),
              Path("third_party/MojoLauncher/mojoexec/jni_bindings/build.gradle"),
              Path("third_party/MojoLauncher/sdl/jni_bindings/build.gradle"),
          ]
          old = "id 'com.android.library' version '8.11.1'"
          new = "id 'com.android.library'"
          for path in targets:
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one pinned Android plugin request in {path}")
              path.write_text(source.replace(old, new))
              print(f"Aligned {path} with the root Android Gradle Plugin classpath")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Rust for Android native build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK and cargo-ndk
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "MOJO_ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Package pinned Android GL4ES compatibility libraries
        env:
          MOJO_SOURCE_COMMIT: 1b8d90424c1cb791321d45f60ac62c54f4b013fa
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/MojoLauncher/MojoLauncher/$MOJO_SOURCE_COMMIT/app_mojo/src/main"
          mkdir -p app/src/main/assets/licenses
          declare -A blobs=(
            [arm64-v8a]=964c4a7714bad3011dd59e6f832c958a7513211a
            [armeabi-v7a]=caf2962636decc6af10ec8d0e797ac2484cdd0d7
            [x86]=b21cc6eecc1cef296c65b50724a5bb4315c61e8b
            [x86_64]=3c23abbd4f9e0304ab084f88d08f53b9624ecda0
          )
          for abi in "${!blobs[@]}"; do
            mkdir -p "app/src/main/jniLibs/$abi"
            file="app/src/main/jniLibs/$abi/libgl4es_114.so"
            curl -fsSL "$base/jniLibs/$abi/libgl4es_114.so" -o "$file"
            actual="$(git hash-object "$file")"
            test "$actual" = "${blobs[$abi]}" || { echo "GL4ES source blob mismatch for $abi"; exit 1; }
            echo "$abi: verified pinned GL4ES blob $actual"
          done
          license="app/src/main/assets/licenses/LICENSE-gl4es.txt"
          curl -fsSL "$base/assets/licenses/LICENSE-gl4es" -o "$license"
          test "$(git hash-object "$license")" = "57dbca92b4cbc989e95d3a6fcb63ea2e70825381"
          echo "Verified GL4ES MIT license text."

      - name: Checkout pinned Pojav Android LWJGL runtime libraries
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: b12ad048157b3aa255d078c235dd4571e1900309
          path: .third_party/PojavLauncher
          sparse-checkout: |
            app_pojavlauncher/src/main/jniLibs
            LICENSE

      - name: Package verified Android LWJGL native modules
        env:
          POJAV_SOURCE_COMMIT: b12ad048157b3aa255d078c235dd4571e1900309
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/PojavLauncherTeam/PojavLauncher/$POJAV_SOURCE_COMMIT/app_pojavlauncher/src/main/jniLibs"
          mkdir -p app/src/main/assets/licenses
          declare -A blobs=(
            [arm64-v8a]="liblwjgl.so:db7926eee2f63f33a450924ea378bd9f07ab502b liblwjgl_opengl.so:42affb58044fd819f8ca69b8480fd9690580769e liblwjgl_nanovg.so:e882a7ecc4915288bb2067f2daf06bd11c33b288 liblwjgl_stb.so:f5b7636dd90c8754509cbd6314e6238de3bb27f1 liblwjgl_tinyfd.so:4cd5dad05a3b812c2afe483ea749ab35f3864a33 libopenal.so:f66c4ff7ba68608473caf12a88689fe989e6716c"
            [armeabi-v7a]="liblwjgl.so:f60e066e203a3ba0e045b4069df47f283a518811 liblwjgl_opengl.so:43a127d904733fc29fe2d6cfd22c62c7a00a81a4 liblwjgl_nanovg.so:d2a325ce0f42e10682bc356814b4c00dad57f059 liblwjgl_stb.so:4e9f6a09a3a4c04a7b3f4b89560e62453af9a73a liblwjgl_tinyfd.so:9687cbb6c4f6293432736de5653bbfcc0feed51e libopenal.so:3dc8bb9582ce35d305891e495ae88458f8ec8dcc"
            [x86]="liblwjgl.so:2abc1bdcf550107180e801abb6405d89ccfad056 liblwjgl_opengl.so:06b7487f7c3cb72c6e656a617c88fe7d518271f3 liblwjgl_nanovg.so:7c4d6750164a917f182c0bde67a0cd084d99a78b liblwjgl_stb.so:3b06eb6c794bdb8fb8311ec15b3780f1d342e8af liblwjgl_tinyfd.so:9bedb534a89cd51fa50423b30bdeed42cd66711d libopenal.so:7cf78857ed8c5dce6d255a28c06cf14b906e9244"
            [x86_64]="liblwjgl.so:cadba70357a73fb3c8d1ad6b18cf6f2ec9fe79d9 liblwjgl_opengl.so:a9fcee9a6194c89e6c464f4eba7461b908e74f38 liblwjgl_nanovg.so:5979a2b6d13337504848b7d8a2729976103a3ce2 liblwjgl_stb.so:29bfb738cdf665cf54e29a1b59b9645416839bc6 liblwjgl_tinyfd.so:ba103170583fe35bb32b93ec3da0a300b539c0b1 libopenal.so:52cf2deb05ad53947debbe550ecdd79e7b78fcac"
          )
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            destination="app/src/main/jniLibs/$abi"
            mkdir -p "$destination"
            for item in ${blobs[$abi]}; do
              library="${item%%:*}"
              expected="${item##*:}"
              file="$destination/$library"
              curl -fsSL "$base/$abi/$library" -o "$file"
              actual="$(git hash-object "$file")"
              test "$actual" = "$expected" || { echo "$abi/$library blob mismatch"; exit 1; }
              echo "$abi/$library: verified Pojav pinned blob $actual"
            done
          done
          curl -fsSL "https://raw.githubusercontent.com/LWJGL/lwjgl3/3.3.3/LICENSE.md" \
            -o app/src/main/assets/licenses/LICENSE-LWJGL.txt
          cp .third_party/PojavLauncher/LICENSE app/src/main/assets/licenses/LICENSE-PojavLauncher.txt
          test -s app/src/main/assets/licenses/LICENSE-LWJGL.txt
          test -s app/src/main/assets/licenses/LICENSE-PojavLauncher.txt

      - name: Install Android GLFW and MojoExec license texts
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          cp native/upstream/mojo-glfw/LICENSE.md app/src/main/assets/licenses/LICENSE-Mojo-GLFW.txt
          cp native/upstream/mojoexec/LICENSE app/src/main/assets/licenses/LICENSE-MojoExec.txt
          test -s app/src/main/assets/licenses/LICENSE-Mojo-GLFW.txt
          test -s app/src/main/assets/licenses/LICENSE-MojoExec.txt

      - name: Build O Engine Rust native library for all Android ABIs
        working-directory: native/oengine
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../../app/src/main/jniLibs build --release
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            destination="../../app/src/main/jniLibs/$abi"
            source="$destination/liboengine_native.so"
            test -s "$source" || { echo "Missing Cargo output $source"; exit 1; }
            cp "$source" "$destination/liboengine.so"
            echo "Packaged Rust JNI library as $destination/liboengine.so"
          done

      - name: Build pinned Android GLFW backend for all Android ABIs
        run: |
          set -euo pipefail
          python3 native/patches/patch_mojo_glfw_input.py
          python3 native/patches/patch_mojo_glfw_egl.py
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            build_dir="$RUNNER_TEMP/oengine-glfw-$abi"
            cmake -S native/android-glfw -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="$MOJO_ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=26 \
              -DGLFW_BUILD_ANDROID=ON -DBUILD_SHARED_LIBS=ON \
              -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF \
              -DGLFW_BUILD_DOCS=OFF -DGLFW_INSTALL=OFF
            cmake --build "$build_dir" --parallel 2
            destination="app/src/main/jniLibs/$abi"
            mkdir -p "$destination"
            for library in libglfw.so libmojoexec.so liblinkerhook.so; do
              source="$(find "$build_dir" -type f -name "$library" -print -quit)"
              test -n "$source" && test -s "$source"
              cp "$source" "$destination/$library"
            done
            if [ "$abi" = "arm64-v8a" ]; then
              source="$(find "$build_dir" -type f -name libfopenhook.so -print -quit)"
              test -n "$source" && test -s "$source"
              cp "$source" "$destination/libfopenhook.so"
            fi
            echo "Built Android GLFW + MojoExec for $abi"
          done

      - name: Build pinned Mojo AWT and JVM native runtime libraries
        run: |
          set -euo pipefail
          mojo_jni="$GITHUB_WORKSPACE/third_party/MojoLauncher/app_mojo/src/main/jni"
          mojoexec_root="$GITHUB_WORKSPACE/third_party/MojoLauncher/mojoexec"
          test -f "$mojoexec_root/CMakeLists.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            destination="$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            build_dir="$RUNNER_TEMP/oengine-mojo-awt-$abi"
            cmake -S native/mojo-awt -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="$MOJO_ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=26 \
              -DMOJO_JNI_ROOT="$mojo_jni" \
              -DMOJOEXEC_ROOT="$mojoexec_root"
            cmake --build "$build_dir" --parallel 2
            for library in libmojoexec.so libmojort.so libmojoawt.so libawt_headless.so libawt_xawt.so; do
              source="$(find "$build_dir" -type f -name "$library" -print -quit)"
              test -n "$source" && test -s "$source"
              cp "$source" "$destination/$library"
              echo "$abi: packaged $library"
            done
          done

      - name: Build and package pinned LTW release AAR
        working-directory: .third_party/LTW
        run: |
          set -euo pipefail
          gradle --no-daemon :ltw:assembleRelease
          test -s ltw/build/outputs/aar/ltw-release.aar
          mkdir -p ../../app/libs
          cp ltw/build/outputs/aar/ltw-release.aar ../../app/libs/ltw-release.aar
          sha256sum ../../app/libs/ltw-release.aar

      - name: Install LTW license texts and third-party notice
        working-directory: .third_party/LTW
        run: |
          set -euo pipefail
          mkdir -p ../../app/src/main/assets/licenses
          cp LICENSE ../../app/src/main/assets/licenses/LGPL-3.0-LTW.txt
          if [ -s /usr/share/common-licenses/GPL-3 ]; then
            cp /usr/share/common-licenses/GPL-3 ../../app/src/main/assets/licenses/GPL-3.0.txt
          else
            curl --fail --show-error --location --retry 4 --retry-all-errors --connect-timeout 20 \
              https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0.txt \
              -o ../../app/src/main/assets/licenses/GPL-3.0.txt
          fi
          test -s ../../app/src/main/assets/licenses/GPL-3.0.txt
          cp ../../THIRD_PARTY_NOTICES.md ../../app/src/main/assets/THIRD_PARTY_NOTICES.md

      - name: Package pinned Mojo Caciocavallo AWT runtime components
        run: |
          set -euo pipefail
          base="https://jitpack.io/com/github/MojoLauncher"
          shared="app/src/main/assets/components/caciocavallo"
          java17="app/src/main/assets/components/caciocavallo17"
          mkdir -p "$shared" "$java17"
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            "$base/caciocavallo/cacio-shared/d0efb5aaba/cacio-shared-d0efb5aaba.jar" \
            -o "$shared/cacio-shared.jar"
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            "$base/caciocavallo/cacio-androidnw/d0efb5aaba/cacio-androidnw-d0efb5aaba.jar" \
            -o "$shared/cacio-androidnw.jar"
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            "$base/caciocavallo17/cacio-tta/-411454b006-1/cacio-tta--411454b006-1-jar-with-dependencies.jar" \
            -o "$java17/cacio-tta.jar"
          for file in "$shared"/*.jar "$java17"/*.jar; do
            test -s "$file"
            jar tf "$file" >/dev/null
            echo "Validated Mojo AWT runtime component: $file"
          done
          mkdir -p app/src/main/assets/licenses
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            "https://raw.githubusercontent.com/MojoLauncher/caciocavallo/d0efb5aaba/LICENSE" \
            -o app/src/main/assets/licenses/GPL-2.0-Caciocavallo.txt
          curl --fail --show-error --location --retry 4 --retry-all-errors \
            "https://raw.githubusercontent.com/MojoLauncher/caciocavallo17/411454b006/LICENSE" \
            -o app/src/main/assets/licenses/GPL-2.0-Caciocavallo17.txt
          test -s app/src/main/assets/licenses/GPL-2.0-Caciocavallo.txt
          test -s app/src/main/assets/licenses/GPL-2.0-Caciocavallo17.txt

      - name: Install MojoLauncher LGPL source license
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          cp third_party/MojoLauncher/LICENSE app/src/main/assets/licenses/LGPL-3.0-MojoLauncher.txt
          test -s app/src/main/assets/licenses/LGPL-3.0-MojoLauncher.txt

      - name: Install original uploaded artwork (preserve filenames)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp artwork/3dd9fe30-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/hero_nether.png
          cp artwork/7a2ad1c0-d9c4-11f1-b74a-cd36149609df.png app/src/main/assets/minecraft_java_logo.png
          cp artwork/a9ac7da0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_trials.png
          cp artwork/a9af8ae0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_spring.png
          cp artwork/b390fdf0-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/news_camel.png
          cp artwork/a9ac2f80-d9c3-11f1-b74a-cd36149609df.png app/src/main/assets/hero_banner_reference.png
          echo "Installed the six original user uploads with explicit asset mapping."

      - name: Validate LTW EGL C ABI header layout
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/oengine_ltw_egl_abi.c" <<'EOF'
          #include <stddef.h>
          #include "oengine_ltw_egl.h"
          _Static_assert(offsetof(OEngineLtwEglShareInfo, display) == 0, "display offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, config) == 1 * sizeof(void*), "config offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, context) == 2 * sizeof(void*), "context offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, pbuffer) == 3 * sizeof(void*), "pbuffer offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, window_surface) == 4 * sizeof(void*), "window surface offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, create_context) == 5 * sizeof(void*), "create context offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, make_current) == 6 * sizeof(void*), "make current offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, destroy_context) == 7 * sizeof(void*), "destroy context offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, destroy_surface) == 8 * sizeof(void*), "destroy surface offset");
          _Static_assert(offsetof(OEngineLtwEglShareInfo, swap_buffers) == 9 * sizeof(void*), "swap buffers offset");
          _Static_assert(sizeof(OEngineLtwEglShareInfo) == 10 * sizeof(void*), "struct size");
          int main(void) { return 0; }
          EOF
          clang -std=c11 -Wall -Wextra -Werror -I native/oengine/include \
            "$RUNNER_TEMP/oengine_ltw_egl_abi.c" -o "$RUNNER_TEMP/oengine_ltw_egl_abi"
          "$RUNNER_TEMP/oengine_ltw_egl_abi"

      - name: Verify pinned Mojo LWJGL2 JNI and native dependencies for all Android ABIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import urllib.request
          import zipfile
          from pathlib import Path

          artifacts = {
              "arm64-v8a": ("https://github.com/MojoLauncher/lwjgl2-glfw/releases/download/vv8m/lwjgl-native-arm64-v8a.jar", 99240, "93126ae6975f1850d25bf9a7c5d26012a12e40ada2b2c101e504f3e8187007a5", "liblwjgl64.so"),
              "armeabi-v7a": ("https://github.com/MojoLauncher/lwjgl2-glfw/releases/download/vv8m/lwjgl-native-armeabi-v7a.jar", 76863, "c99a2c617cf29c714128868ac8b3c4a0304a2d8dcfa21dbeee4fa398771b554a", "liblwjgl.so"),
              "x86": ("https://github.com/MojoLauncher/lwjgl2-glfw/releases/download/vv8m/lwjgl-native-x86.jar", 107351, "59be4d04330874a8e55c98eee2c0913f11b913268dc80a91b0f571730c6db3b3", "liblwjgl.so"),
              "x86_64": ("https://github.com/MojoLauncher/lwjgl2-glfw/releases/download/vv8m/lwjgl-native-x86_64.jar", 100331, "4129e73bfb44415db29ef9ff9c4057db46cfceafec308c372a41db8bab72a55d", "liblwjgl64.so"),
          }
          root = Path("build/mojo-lwjgl2-audit")
          for abi, (url, expected_size, expected_sha256, library_name) in artifacts.items():
              archive = urllib.request.urlopen(url, timeout=60).read()
              if len(archive) != expected_size or hashlib.sha256(archive).hexdigest() != expected_sha256:
                  raise SystemExit(f"{abi}: pinned Mojo archive size/SHA-256 mismatch")
              with zipfile.ZipFile(io.BytesIO(archive)) as jar:
                  matches = [item for item in jar.infolist()
                             if not item.is_dir() and item.filename.rsplit("/", 1)[-1] == library_name]
                  if len(matches) != 1:
                      raise SystemExit(f"{abi}: expected exactly one {library_name}, found {len(matches)}")
                  output = root / abi / library_name
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(jar.read(matches[0]))
              print(f"{abi}: verified pinned archive and extracted {library_name}")
          PY
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            case "$abi" in
              arm64-v8a) library="liblwjgl64.so" ;;
              x86_64) library="liblwjgl64.so" ;;
              *) library="liblwjgl.so" ;;
            esac
            native="build/mojo-lwjgl2-audit/$abi/$library"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" --version >/dev/null
            python3 native/tools/verify_mojo_lwjgl2_jni.py "$native" \
              --nm "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
            python3 native/tools/audit_mojo_lwjgl2_dependencies.py "$native" \
              --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
              --allow-extra libglfw.so --allow-extra libgl4es_114.so \
      --allow-extra libjawt.so
          done

      - name: Run engine JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Rust native engine and JNI exports in APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for library in liboengine.so libglfw.so libltw.so libmojoexec.so libmojort.so libmojoawt.so libawt_headless.so libawt_xawt.so liblinkerhook.so liblwjgl.so liblwjgl_opengl.so libgl4es_114.so; do
              unzip -l "$apk" | grep -F "lib/$abi/$library" >/dev/null || {
                echo "Missing $abi/$library from APK"
                exit 1
              }
            done
          done
          unzip -l "$apk" | grep -F "lib/arm64-v8a/libfopenhook.so" >/dev/null
          dex_strings="$RUNNER_TEMP/oengine-dex-strings.txt"
          : > "$dex_strings"
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> "$dex_strings"
          done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?[.]dex$')
          grep -F 'Lcom/alauncher/olauncher/OEngineMojoAwtActivity;' "$dex_strings" >/dev/null
          grep -F 'Lgit/artdeell/mojo/awt/AWTActivity;' "$dex_strings" >/dev/null
          grep -F 'Lgit/artdeell/mojo/ExitActivity;' "$dex_strings" >/dev/null
          unzip -p "$apk" assets/THIRD_PARTY_NOTICES.md | grep -F "Android LWJGL native runtime" >/dev/null
          unzip -l "$apk" | grep -F "assets/forge_installer.jar" >/dev/null
          unzip -l "$apk" | grep -F "assets/components/caciocavallo/cacio-shared.jar" >/dev/null
          unzip -l "$apk" | grep -F "assets/components/caciocavallo/cacio-androidnw.jar" >/dev/null
          unzip -l "$apk" | grep -F "assets/components/caciocavallo17/cacio-tta.jar" >/dev/null
          unzip -l "$apk" | grep -F "assets/licenses/GPL-2.0-Caciocavallo.txt" >/dev/null
          unzip -l "$apk" | grep -F "assets/licenses/GPL-2.0-Caciocavallo17.txt" >/dev/null
          echo "APK contains the Mojo AWT Java entry points, native runtime libraries, and Caciocavallo assets."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: o-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
