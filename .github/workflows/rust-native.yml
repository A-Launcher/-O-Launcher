name: O Engine Rust Native CI

# Keep only the newest validation run for this branch; older commits are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "native/**"
      - ".github/workflows/rust-native.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "native/**"
      - ".github/workflows/rust-native.yml"
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile public C input ABI header
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I native/oengine/include native/oengine/tests/input_bridge_header_test.c
      - name: Run native policy tests
        run: cargo test --manifest-path native/oengine/Cargo.toml

  android-abis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK (retry transient SDK download failures)
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          # GitHub-hosted runners occasionally receive truncated NDK archives
          # ("Premature EOF"). Remove partial installs and retry the package
          # download rather than failing the only four-ABI native build.
          installed=false
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "ndk;$NDK_VERSION" && test -x "$NDK_DIR/ndk-build"; then
              installed=true
              break
            fi
            echo "NDK installation attempt $attempt failed; clearing partial package."
            rm -rf "$NDK_DIR" "$ANDROID_HOME/.temp"
            sleep $((attempt * 10))
          done
          if [ "$installed" != true ]; then
            echo "Could not install Android NDK $NDK_VERSION after three attempts."
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build four Android ABIs
        working-directory: native/oengine
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../../target/android-jni build --release
      - name: Verify Android ELF outputs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "target/android-jni/$abi/liboengine_native.so"
            file "target/android-jni/$abi/liboengine_native.so"
          done
      - name: Verify production JNI renderer exports
        run: |
          set -euo pipefail
          symbols=(
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeCreateLtwEglSession
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeAttachLtwWindow
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeDetachLtwWindow
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeQueueLtwWindow
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeProcessPendingLtwWindow
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeSwapLtwBuffers
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeLtwEglInfo
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeLtwEglError
            Java_com_alauncher_olauncher_OEngineJvmNativeBridge_nativeDestroyLtwEglSession
          )
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            library="target/android-jni/$abi/liboengine_native.so"
            for symbol in "${symbols[@]}"; do
              if ! readelf -Ws "$library" | grep -Fq "$symbol"; then
                echo "Missing production JNI export $symbol in $abi"
                exit 1
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: oengine-rust-android-native
          path: target/android-jni/*/liboengine_native.so
