name: LTW Renderer Artifact

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/ltw-renderer.yml"
      - "ENGINE_ARCHITECTURE.md"
      - ".github/workflows/android-ci.yml"
      - "app/src/main/java/com/alauncher/olauncher/OEngineRendererArtifact.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngineRendererProviderContract.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngineRendererLaunchPlan.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngineJvmNativeBridge.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngineGameProcessService.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngineGameProcessClient.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngineLtwArtifactInstaller.kt"
      - "app/src/main/java/com/alauncher/olauncher/OEngine.kt"
      - "app/src/main/java/com/alauncher/olauncher/MainActivity.kt"
      - "app/build.gradle.kts"
      - "THIRD_PARTY_NOTICES.md"

jobs:
  build-ltw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout O Launcher
        uses: actions/checkout@v4

      - name: Checkout pinned LTW source
        uses: actions/checkout@v4
        with:
          repository: MojoLauncher/LTW
          ref: 3f1f4df6c80c925ea34067b1d943a84acce0184d
          path: .third_party/LTW

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Install pinned native build tools
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build LTW release AAR
        working-directory: .third_party/LTW
        run: gradle --no-daemon :ltw:assembleRelease

      - name: Validate AAR native libraries
        env:
          AAR_PATH: .third_party/LTW/ltw/build/outputs/aar/ltw-release.aar
          LTW_COMMIT: 3f1f4df6c80c925ea34067b1d943a84acce0184d
        run: |
          set -euo pipefail
          test -s "$AAR_PATH"
          python3 - <<'PY'
          import os, zipfile, struct, sys
          path = os.environ["AAR_PATH"]
          expected = {
              "arm64-v8a": (2, 183),
              "armeabi-v7a": (1, 40),
              "x86": (1, 3),
              "x86_64": (2, 62),
          }
          with zipfile.ZipFile(path) as aar:
              entries = [n for n in aar.namelist() if n.startswith("jni/") and n.endswith("/libltw.so")]
              if not entries:
                  raise SystemExit("AAR contains no jni/*/libltw.so native libraries")
              seen = set()
              for name in entries:
                  parts = name.split("/")
                  if len(parts) != 3 or parts[1] not in expected:
                      raise SystemExit(f"Unexpected native library path: {name}")
                  abi = parts[1]
                  data = aar.read(name)
                  if len(data) < 64 or data[:4] != b"\x7fELF":
                      raise SystemExit(f"Invalid ELF payload: {name}")
                  elf_class, endian = data[4], data[5]
                  if endian != 1:
                      raise SystemExit(f"Expected little-endian ELF: {name}")
                  machine = struct.unpack_from("<H", data, 18)[0]
                  want_class, want_machine = expected[abi]
                  if (elf_class, machine) != (want_class, want_machine):
                      raise SystemExit(f"ABI mismatch in {name}: class={elf_class}, machine={machine}")
                  seen.add(abi)
                  print(f"Validated {name}: {len(data)} bytes, ELF class {elf_class}, machine {machine}")
              print("Validated ABIs: " + ", ".join(sorted(seen)))
          PY
          printf '%s\n' "$LTW_COMMIT" > ltw-upstream-commit.txt
          sha256sum "$AAR_PATH" > ltw-release-aar.sha256

      - name: Validate LTW EGL and LWJGL resolver exports
        env:
          AAR_PATH: .third_party/LTW/ltw/build/outputs/aar/ltw-release.aar
        run: |
          set -euo pipefail
          NM="$(command -v nm)"
          READELF="$(command -v readelf)"
          test -x "$NM"
          test -x "$READELF"
          export NM READELF
          python3 - <<'PY'
          import os, zipfile, subprocess, tempfile
          aar_path = os.environ["AAR_PATH"]
          required = {
              "eglGetProcAddress",
              "eglCreateContext",
              "eglDestroyContext",
              "eglMakeCurrent",
              "glXGetProcAddress",
          }
          allowed_needed = {"liblog.so", "libm.so", "libdl.so", "libc.so", "libandroid.so", "libEGL.so", "libGLESv2.so", "libGLESv3.so"}
          nm = os.environ["NM"]
          readelf = os.environ["READELF"]
          with zipfile.ZipFile(aar_path) as aar:
              libs = [n for n in aar.namelist() if n.startswith("jni/") and n.endswith("/libltw.so")]
              if not libs:
                  raise SystemExit("No LTW native libraries found")
              for entry in libs:
                  abi = entry.split("/")[1]
                  with tempfile.NamedTemporaryFile(suffix=".so") as f:
                      f.write(aar.read(entry))
                      f.flush()
                      symbols = subprocess.check_output(
                          [nm, "--dynamic", "--defined-only", f.name], text=True
                      )
                      exported = {line.split()[-1].split("@")[0] for line in symbols.splitlines() if line.split()}
                      missing = required - exported
                      if missing:
                          raise SystemExit(f"{abi}: missing required exported symbols: {sorted(missing)}")
                      dynamic = subprocess.check_output([readelf, "--dynamic", f.name], text=True)
                      needed = set()
                      for line in dynamic.splitlines():
                          if "(NEEDED)" in line:
                              needed.add(line.split("[", 1)[1].split("]", 1)[0])
                      unexpected = needed - allowed_needed
                      if unexpected:
                          raise SystemExit(f"{abi}: unexpected native dependencies: {sorted(unexpected)}")
                      print(f"{abi}: required EGL/LWJGL symbols exported; dependencies={sorted(needed)}")
          PY

      - name: Upload validated LTW AAR
        uses: actions/upload-artifact@v4
        with:
          name: ltw-release-aar-3f1f4df
          path: |
            .third_party/LTW/ltw/build/outputs/aar/ltw-release.aar
            ltw-upstream-commit.txt
            ltw-release-aar.sha256
          if-no-files-found: error
